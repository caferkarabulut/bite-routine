appId: com.biteroutine.mobile
---
- launchApp:
    clearState: true
- runFlow: subflows/onboarding.yaml
- tapOn: "Ayarlar(, tab.*)?"
- tapOn: "English"
- assertVisible: "Settings(, tab.*)?"
- assertVisible: "Today(, tab.*)?"
- tapOn: "Türkçe"
- assertVisible: "Ayarlar(, tab.*)?"
- assertVisible: "Bugün(, tab.*)?"
# Profile saves all edits together and confirms in place before returning.
- tapOn: "Profil ve hedef.*"
- tapOn:
    id: onboarding-weight
- eraseText: 6
- inputText: "79"
- runFlow:
    file: subflows/dismiss-keyboard.yaml
- tapOn: "Güncelle"
- assertVisible: "Güncellendi."
- tapOn: "Geri"
- assertVisible: "Profil ve hedef.*"
# Center the field: at the screen edge it ends up under the number pad and taps land on its keys.
- scrollUntilVisible:
    element:
      id: water-goal-input
    centerElement: true
- tapOn:
    id: water-goal-input
- eraseText: 6
- inputText: "2500"
- runFlow:
    file: subflows/dismiss-keyboard.yaml
- tapOn: "Kaydet"
# The water goal confirmation stays in the same card as its save button.
- takeScreenshot: settings-water-saved
- scrollUntilVisible:
    element: "Su hedefi kaydedildi."
- tapOn: "Bugün(, tab.*)?"
- scrollUntilVisible:
    element: "200 ml ekle"
- assertVisible: "0 / 2.500 ml"
- tapOn: "Ayarlar(, tab.*)?"
# Center the button: at the end of the list it can sit half under the tab bar, which takes the tap.
- scrollUntilVisible:
    element: "Tüm verileri sil"
    centerElement: true
- tapOn: "Tüm verileri sil"
- assertVisible: "Tüm veriler silinsin mi?"
- tapOn:
    id: delete-all-input
- inputText: "SİL"
- tapOn: "Hepsini sil"
- extendedWaitUntil:
    visible: "Seni tanıyalım"
    timeout: 10000

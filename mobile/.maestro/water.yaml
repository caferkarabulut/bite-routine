appId: com.biteroutine.mobile
---
- launchApp:
    clearState: true
- runFlow: subflows/onboarding.yaml
- scrollUntilVisible:
    element: "200 ml ekle"
    centerElement: true
- assertVisible: "0 / 2.000 ml"
- tapOn: "200 ml ekle"
- assertVisible: "200 / 2.000 ml"
- tapOn: "500 ml ekle"
- assertVisible: "700 / 2.000 ml"
# Undo appears next to the water total after an add; center it so the tap misses the tab bar on small screens.
- scrollUntilVisible:
    element: "Son eklemeyi geri al"
    centerElement: true
- tapOn: "Son eklemeyi geri al"
- assertVisible: "200 / 2.000 ml"

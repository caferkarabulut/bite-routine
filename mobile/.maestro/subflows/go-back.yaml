# Leaves a modal form the way a user does on each platform.
# Android: close the keyboard first (the first back press would only close it), then the hardware/gesture back key.
# iOS: modal forms (custom food) draw their own back chevron ("Geri") at the top left; tap it like a user.
# (A swipe-down is blocked by iOS while the unsaved-changes guard is active, so it cannot show the prompt.)
appId: com.biteroutine.mobile
---
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: dismiss-keyboard.yaml
      - pressKey: back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Geri"

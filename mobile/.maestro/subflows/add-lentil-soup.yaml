# From Today: add 1,5 kepçe Mercimek çorbası to breakfast.
appId: com.biteroutine.mobile
---
# The meal cards start under the tab bar on small screens, and a plain `scroll` on a tall screen can push the
# Kahvaltı button off the top: bring exactly that button to the middle before tapping.
- scrollUntilVisible:
    element:
      id: add-breakfast
    centerElement: true
- tapOn:
    id: add-breakfast
- tapOn:
    id: catalog-search
- inputText: "mercimek"
- tapOn:
    text: "Mercimek çorbası.*"
- scrollUntilVisible:
    element: "1 kepçe \\(150 g\\)"
    centerElement: true
- tapOn: "1 kepçe \\(150 g\\)"
- tapOn:
    id: amount-input
- eraseText: 5
- inputText: "1,5"
- runFlow:
    file: dismiss-keyboard.yaml
- scrollUntilVisible:
    element:
      id: add-to-diary
- tapOn:
    id: add-to-diary

appId: com.biteroutine.mobile
---
- launchApp:
    clearState: true
- runFlow: subflows/onboarding.yaml
- assertVisible: "0 kcal"
- tapOn:
    id: today-add
- assertVisible:
    id: catalog-search
- runFlow: subflows/back-from-push.yaml
# iOS tab navigation has no edge-swipe back; return using the Today tab if still in Catalog.
- runFlow:
    when:
      visible:
        id: catalog-search
    commands:
      - tapOn: "Bugün(, tab.*)?"
- assertVisible:
    id: today-add
- runFlow: subflows/add-lentil-soup.yaml
# Calorie card (Today keeps its scroll offset after returning, so scroll to the top first).
- scrollUntilVisible:
    element: "Yenen"
    direction: UP
- extendedWaitUntil:
    visible: "137 kcal"
    timeout: 8000
- assertNotVisible: "0 kcal"
# The entry sits in the meals card; the Kahvaltı header carries its 137 kcal meal total.
- scrollUntilVisible:
    element: ".*1,5 kepçe.*"
- assertVisible: "Kahvaltı.*137 kcal"
- takeScreenshot: add-food-today

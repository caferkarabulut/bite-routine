appId: com.biteroutine.mobile
---
- launchApp:
    clearState: true
- runFlow: subflows/onboarding.yaml
- runFlow: subflows/add-lentil-soup.yaml
# Scroll to the top first: Android only exposes on-screen rows, so the entry must be in view to be matched.
- scrollUntilVisible:
    element: "Kalori"
    direction: UP
- extendedWaitUntil:
    visible: "Mercimek çorbası.*"
    timeout: 8000
- scrollUntilVisible:
    element: ".*1,5 kepçe.*"
- tapOn: ".*1,5 kepçe.*"
- extendedWaitUntil:
    visible:
      id: amount-input
    timeout: 5000
- tapOn:
    id: amount-input
- eraseText: 5
- inputText: "2"
- runFlow:
    file: subflows/dismiss-keyboard.yaml
- scrollUntilVisible:
    element: "Kaydet"
- tapOn: "Kaydet"
- scrollUntilVisible:
    element: "Kalori"
    direction: UP
- scrollUntilVisible:
    element: ".*, 2 kepçe, .*"
- assertVisible: "183 kcal"
- tapOn: ".*, 2 kepçe, .*"
- extendedWaitUntil:
    visible:
      id: amount-input
    timeout: 5000
- scrollUntilVisible:
    element: "Kaydı sil"
- tapOn: "Kaydı sil"
- tapOn: "Sil"
- extendedWaitUntil:
    visible: "Bugün henüz bir şey eklemedin."
    timeout: 5000
- assertNotVisible: "Mercimek çorbası.*"
- scrollUntilVisible:
    element: "Kalori"
    direction: UP
- assertVisible: "0 / .* kcal"
